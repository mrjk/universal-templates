# Zensical reads mkdocs.yml (Material for MkDocs successor).
# From repo root:  zensical serve -f docs/mkdocs.yml
# Or from docs/:   zensical serve

site_name: universal-templates
site_description: Git catalog of project scaffolds and reusable snippets

docs_dir: content
site_dir: site
dev_addr: localhost:8089

theme:
  variant: modern

nav:
  - Catalog:
    - Learn: index.md
    - Overview: overview.md
    - Layout & hosting: catalog.md
    - Inventory: inventory.md
    - Status: status.md
  - Guides:
    - Authoring: guides/index.md
  - ADRs:
    - Index: adr/README.md
    - 0001 Purpose: adr/0001-purpose-and-vision.md
    - 0003 Catalog layout: adr/0003-catalog-layout-and-self-hosting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  # Live inventory of projects/ + files/ — see macros.py
  # Only pages with `render_macros: true` front matter are templated.
  - zensical.extensions.macros:
      module_name: macros
      render_by_default: false
      on_error_fail: true
