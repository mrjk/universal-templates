# https://taskfile.dev — run from docs/ (`task serve`) or repo root via include (`task docs:serve`)
version: "3"

tasks:
  install:
    desc: Sync Python deps (snipseed + docs) into repo .venv
    dir: ..
    cmds:
      - mise exec -- uv sync --all-groups

  serve:
    desc: Preview docs at http://localhost:8089
    cmds:
      # Drop Zensical page cache so macros re-scan projects/ + files/
      - rm -rf .cache
      - zensical serve -f mkdocs.yml

  build:
    desc: Build static site into site/
    cmds:
      - rm -rf .cache
      - zensical build -f mkdocs.yml
