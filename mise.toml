# Dev tooling for this catalog (projects/ + files/ + docs).
# Setup: mise trust && mise install
# Lockfile: mise.lock
#
# Do NOT define mise [tasks.*] here — use Taskfile.yml (`task …`).
# CLIs (seed / snip) live in https://github.com/mrjk/snipseed

[tools]
python = "3.12.13"
task = "3.52.0"
# Optional: authors testing Copier scaffolds under projects/
copier = "9.17.0"

[env]
_.python.venv = { path = ".venv", create = true }

[settings]
lockfile = true
