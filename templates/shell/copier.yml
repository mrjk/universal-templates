_subdirectory: template
_min_copier_version: "9.0.0"

project_slug:
  type: str
  help: Script / project name (used as the executable filename)
  validator: >-
    {% if not (project_slug | regex_search('^[a-zA-Z][a-zA-Z0-9_-]*$')) %}
    Must start with a letter; letters, digits, underscores, hyphens only
    {% endif %}

description:
  type: str
  help: Short project description
  default: "A shell script"
