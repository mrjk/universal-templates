name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: ShellCheck
        run: shellcheck bin/seed bin/snip

      - name: Run Python unittest (ut_cli)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          UT_CATALOG_REPO: ${{ github.workspace }}
