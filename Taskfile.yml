# https://taskfile.dev
version: "3"

includes:
  docs:
    taskfile: docs/Taskfile.yml
    dir: docs

tasks:
  list:
    desc: Show root tasks
    aliases:
      - default
    silent: true
    cmds:
      - task --list

  ci:
    desc: Build catalog docs (local CI)
    cmds:
      - task: docs:build
