# https://taskfile.dev
version: "3"

includes:
  docs:
    taskfile: docs/Taskfile.yml
    dir: docs

tasks:
  lint:
    desc: ShellCheck seed and snip shims
    cmds:
      - shellcheck bin/seed bin/snip

  test:py:
    desc: Run Python unittest suite for ut_cli
    cmds:
      - python -m unittest discover -s tests -p 'test_*.py' -v

  test:
    desc: Run Python tests
    cmds:
      - task: test:py

  ci:
    desc: Lint + test (local CI)
    deps: [lint, test]
