# https://taskfile.dev
version: "3"

includes:
  docs:
    taskfile: docs/Taskfile.yml
    dir: docs

tasks:
  lint:
    desc: ShellCheck bp, install.sh, seed, snip
    cmds:
      - shellcheck bin/bp install.sh bin/seed bin/snip

  test:py:
    desc: Run Python unittest suite for ut_cli
    cmds:
      - python -m unittest discover -s tests -p 'test_*.py' -v

  test:bats:
    desc: Run bats tests for bp
    cmds:
      - bats tests/bp.bats

  test:
    desc: Run bats + Python tests
    cmds:
      - task: test:bats
      - task: test:py

  ci:
    desc: Lint + test (local CI)
    deps: [lint, test]
