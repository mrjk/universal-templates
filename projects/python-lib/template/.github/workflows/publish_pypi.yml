---
name: publish-pypi

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          uv_args: "--all-groups"
      - name: Run full test gate
        run: task test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: "3.12"
          uv_args: "--group dev"
      - name: Publish to PyPI
        run: task publish_pypi
