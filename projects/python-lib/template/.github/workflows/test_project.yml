---
name: test-project

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          uv_args: "--all-groups"

      - name: Run full test gate
        run: task test
